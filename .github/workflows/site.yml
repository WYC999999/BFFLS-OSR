# 自动把仓库所有分支构建成一个可浏览的静态网站并发布到 GitHub Pages
# 分支有任何更新都会自动重建
name: Deploy multi-branch site

on:
  push:            # 任何分支有 push 都触发
  workflow_dispatch:  # 也允许手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (拉取全部历史与分支)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install markdown renderer
        run: pip install markdown

      - name: Build multi-branch site
        run: |
          python build_site.py \
            --repo . \
            --repo-url https://github.com/RICK-ALSTEY/BFFLS-OSR \
            --out _site \
            --title "BFFLS-OSR"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
